name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --force-jit

      - name: Analyze
        run: flutter analyze

      # CI never has the commercial .riv asset, so a green run here also
      # proves the repo builds and tests cleanly without it.
      - name: Test
        run: flutter test
