name: fitness_buddy
description: "An open source fitness tracking application with an interactive muscle heatmap"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.0
  drift: ^2.30.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  fl_chart: ^1.1.0
  rive: ^0.14.5
  uuid: ^4.5.0
  equatable: ^2.0.7
  collection: ^1.19.0
  intl: ^0.20.2
  logging: ^1.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/rive/
